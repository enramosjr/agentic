      - uses: ./deploy/authority/artifact_upload
        with:
          role: trial-proof
          task: ${{ needs.trial_prepare.outputs.request }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_ORIGIN_TOKEN }}
          AGENTIC_CODING_PRIVATE_KEY: ${{ secrets.AGENTIC_CODING_PRIVATE_KEY }}
  trial_merge_proof:
    needs: [trial_prepare]
    name: proof (merge)
    runs-on: ubuntu-latest
