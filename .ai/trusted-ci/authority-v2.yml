# Installed only in the independent authority repository; v1 stays unchanged.
# All service entrypoints remain held; this is not a qualified production workflow.
name: AGENTIC v2 authority
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed credential or protected task producer path
        type: choice
        options: [credentials, task, production, qualification, case]
        default: credentials
        required: true
      challenges:
        description: Exact seven-purpose setup challenges from the trusted native coordinator
        type: string
        required: false
        default: '{}'
      prompt:
        description: Bounded task text; never a command or authority selector
        type: string
        required: false
      handoff:
        description: Bounded native record lookup hint; never authority or execution consent
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: agentic-authority
  cancel-in-progress: false
jobs:
  trial_case_ready:
    if: inputs.mode == 'case'
    name: trial case ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
        working-directory: deploy/authority/artifact_upload
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        with:
          role: case-ready
          task: ${{ inputs.handoff }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_CASE_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_CASE_ORIGIN_TOKEN }}
  trial_case_handoff:
    needs: [prepare]
    if: inputs.mode == 'case'
    name: trial case handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
        working-directory: deploy/authority/artifact_upload
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        with:
          role: case-handoff
          task: ${{ needs.prepare.outputs.request }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_CASE_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_CASE_ORIGIN_TOKEN }}
  trial_handoff:
    if: inputs.mode == 'qualification'
    name: trial handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
        working-directory: deploy/authority/artifact_upload
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        with:
          role: trial-handoff
          task: ${{ inputs.handoff }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_ORIGIN_TOKEN }}
  trial_prepare:
    needs: [trial_handoff]
    name: trial preparation
    outputs:
      request: ${{ steps.produce.outputs.request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
        working-directory: deploy/authority/artifact_upload
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        id: produce
        with:
          role: trial-prepare
          task: ${{ inputs.handoff }}
          prompt: ${{ inputs.prompt }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_ORIGIN_TOKEN }}
  trial_model_auth:
    needs: [trial_prepare]
    name: model authorization
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
        working-directory: deploy/authority/artifact_upload
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        with:
          role: trial-model
          task: ${{ needs.trial_prepare.outputs.request }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_ORIGIN_TOKEN }}
          AGENTIC_MODEL_VAULT_KEY: ${{ secrets.AGENTIC_MODEL_VAULT_KEY }}
          AGENTIC_MODEL_DELIVERY_KEY: ${{ secrets.AGENTIC_MODEL_DELIVERY_KEY }}
  trial_admin_proof:
    needs: [trial_prepare]
    name: proof (admin)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
        working-directory: deploy/authority/artifact_upload
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        with:
          role: trial-proof
          task: ${{ needs.trial_prepare.outputs.request }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_ORIGIN_TOKEN }}
          AGENTIC_ADMIN_PRIVATE_KEY: ${{ secrets.AGENTIC_ADMIN_PRIVATE_KEY }}
  trial_reader_proof:
    needs: [trial_prepare]
