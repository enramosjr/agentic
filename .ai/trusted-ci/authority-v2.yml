      - uses: ./deploy/authority/artifact_upload
        with:
          role: proof
          task: ${{ needs.prepare.outputs.request }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_ISSUER_PRIVATE_KEY: ${{ secrets.AGENTIC_ISSUER_PRIVATE_KEY }}
  coding_proof:
    needs: [prepare, verify]
    name: proof (coding)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
