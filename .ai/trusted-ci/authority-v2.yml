        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        with:
          role: credential
          challenge: ${{ toJSON(fromJSON(inputs.challenges).admin) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_ADMIN_PRIVATE_KEY: ${{ secrets.AGENTIC_ADMIN_PRIVATE_KEY }}
  reader_credential_proof:
