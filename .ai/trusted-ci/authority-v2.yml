      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned trusted consumer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/authority/requirements-auth.txt
      - name: Install locked artifact SDK without lifecycle scripts
        working-directory: deploy/authority/artifact_upload
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./deploy/authority/artifact_upload
        with:
          role: trial-proof
          task: ${{ needs.trial_prepare.outputs.request }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_TRIAL_ORIGIN_TOKEN: ${{ secrets.AGENTIC_TRIAL_ORIGIN_TOKEN }}
          AGENTIC_MERGE_PRIVATE_KEY: ${{ secrets.AGENTIC_MERGE_PRIVATE_KEY }}
  qualification:
    needs: [trial_prepare, trial_model_auth, trial_admin_proof, trial_reader_proof, trial_issuer_proof, trial_coding_proof, trial_merge_proof]
    name: hosted qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
